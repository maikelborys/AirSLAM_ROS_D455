# Single-image relocalization on an XFeat+PLNet-lines refined map.
# Pairs with vo_euroc_xfeat_lighterglue_lines.yaml +
# mr_euroc_xfeat_lines.yaml — the map must have been produced by THAT
# pipeline (point_voc_L4_xfeat.bin point DBoW + PLNet 256-dim junction
# DBoW serialized inside AirSLAM_mapv1.bin).
#
# Map_user.Relocalization runs the same FeatureDetector pipeline per
# query image (XFeat for points, PLNet for lines+junctions), then does
# DBoW query over BOTH the point and junction databases.
min_inlier_num: 45
pose_refinement: 1   # slower but more stable

plnet:
  feature_extractor: 2          # XFeat for points
  line_extractor: 1             # PLNet wireframe head for lines + junctions
  use_superpoint: 0
  max_keypoints: 512            # MUST match the lighterglue.pt trace --num-kpts
  keypoint_threshold: 0.05
  remove_borders: 4
  line_threshold: 0.75
  line_length_threshold: 50
  xfeat_input_height: 480
  xfeat_input_width: 752
  xfeat_nms_kernel_size: 5

point_matcher:
  matcher: 3                    # 0=lightglue, 1=superglue, 2=MNN, 3=LighterGlue
  image_width: 752
  image_height: 480
  descriptor_dim: 64
  min_cosine_similarity: 0.0    # unused for LighterGlue (it has its own gate)
  lowe_ratio: 0.0
  require_mutual_nn: 0
  onnx_file: ""                 # no ONNX path
  engine_file: "lighterglue.pt" # resolved against model_dir

pose_estimation:
  mono_point: 50
  stereo_point: 75
  mono_line: 50
  stereo_line: 75
  rate: 0.5

ros_publisher:
  feature: 1
  feature_topic: "/AirSLAM/feature"
  frame_pose: 1
  frame_pose_topic: "/AirSLAM/frame_pose"
  frame_odometry_topic: "/AirSLAM/LatestOdometry"
  keyframe: 1
  keyframe_topic: "/AirSLAM/keyframe"
  path_topic: "/AirSLAM/odometry"
  map: 1
  map_topic: "/AirSLAM/map"
  mapline: 1
  mapline_topic: "/AirSLAM/mapline"
  reloc: 1
  reloc_topic: "/AirSLAM/reloc"
